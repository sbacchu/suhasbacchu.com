steps:
  - name: gcr.io/cloud-builders/gcloud
    args:
      - kms
      - decrypt
      - --ciphertext-file=.env.enc
      - --plaintext-file=.env
      - --location=global
      - --keyring=portfolio-website
      - --key=cloudbuild-env
  # Insert other build steps here

  # Install
  - name: "node:20"
    entrypoint: npm
    args: ["install"]

  # Update Node version
  # - name: "gcr.io/cloud-builders/npm"
  #   args: ["install", "npm@latest", "-g"]

  # Build
  - name: "node:20"
    entrypoint: npm
    args: ["run", "build"]

  # Deploy
  - name: "node:20"
    entrypoint: npm
    args: ["run", "deploy"]
